<script>
  (function () {
    const reveal = document.querySelector('[data-reveal]');
    if (!reveal) return;
    const handle = reveal.querySelector('.hero-reveal__handle');
    const step = 0.05;
    let dragging = false;

    function setReveal(v) {
      const clamped = Math.max(0, Math.min(1, v));
      reveal.style.setProperty('--reveal', clamped);
      handle.setAttribute('aria-valuenow', Math.round(clamped * 100));
    }

    function positionFromEvent(e) {
      const rect = reveal.getBoundingClientRect();
      const x = e.clientX - rect.left;
      return x / rect.width;
    }

    function startDrag(e) {
      dragging = true;
      reveal.dataset.dragging = 'true';
      reveal.setPointerCapture?.(e.pointerId);
      setReveal(positionFromEvent(e));
      e.preventDefault();
    }

    function moveDrag(e) {
      if (!dragging) return;
      setReveal(positionFromEvent(e));
    }

    function endDrag(e) {
      if (!dragging) return;
      dragging = false;
      reveal.dataset.dragging = 'false';
      reveal.releasePointerCapture?.(e.pointerId);
    }

    reveal.addEventListener('pointerdown', startDrag);
    reveal.addEventListener('pointermove', moveDrag);
    reveal.addEventListener('pointercancel', endDrag);
    reveal.addEventListener('pointerup', endDrag);

    handle.addEventListener('keydown', (e) => {
      const current = parseFloat(reveal.style.getPropertyValue('--reveal')) || 0.5;
      let next = current;
      switch (e.key) {
        case 'ArrowLeft':  next = current - step; break;
        case 'ArrowRight': next = current + step; break;
        case 'Home':       next = 0; break;
        case 'End':        next = 1; break;
        default: return;
      }
      e.preventDefault();
      setReveal(next);
    });
  })();
</script>
