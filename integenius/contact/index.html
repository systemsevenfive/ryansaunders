<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact - Integenius</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>

<div class="top">
  <div class="wrap">
    <a class="brand" href="/">
      <span class="cbox" aria-hidden="true"></span>
      <span class="pin" aria-hidden="true"></span>
      Ryan Saunders
    </a>
    <nav class="links" aria-label="Primary">
      <a href="/#work">work</a>
      <a href="/#lab">lab</a>
      <a href="/about/">about</a>
      <a href="/#contact">contact</a>
    </nav>
  </div>
</div>

<main class="page">
  <div class="contact-container">
    <div class="button-container">
      <a href="/" class="back-link">← Back to Home</a>
      <a href="/integenius/" class="back-link">Integenius</a>
    </div>

    <div class="contact-content">
                <h1>Integenius Contact</h1>

                <p></p>

                <form
                    action="https://formspree.io/f/mvgyazvd"
                    method="POST"
                    class="contact-form"
                >
                    <div class="form-group">
                        <label for="email"></label>
                        <input type="email" name="email" id="email" required>
                    </div>
                    <div class="form-group">
                        <label for="message"></label>
                        <textarea name="message" id="message" required></textarea>
                    </div>
                    <button type="submit" class="submit-button"></button>
                </form>
    </div>

    <div class="button-container button-container--footer">
      <a href="/" class="back-link">← Back to Home</a>
      <a href="/integenius/" class="back-link">Integenius</a>
    </div>
  </div>
</main>

<footer>
  <div class="wrap">
    <span>© 2026 · Ryan Saunders</span>
    <span>built plain · loads fast</span>
  </div>
</footer>

</body>
</html>
